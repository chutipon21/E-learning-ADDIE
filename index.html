`<h2>บทที่ 1 ภาพรวม e-Learning และ ADDIE</h2><p>e-Learning คือการจัดการเรียนรู้ผ่านเทคโนโลยีดิจิทัล อาจเรียนพร้อมกันแบบ <b>synchronous</b> เช่น ห้องเรียนสด หรือไม่พร้อมกันแบบ <b>asynchronous</b> เช่น เรียนคลิปและทำกิจกรรมตามเวลา</p><h3>กระบวนการ ADDIE</h3><div class="scroll"><table><thead><tr><th>ขั้น</th><th>คำถามหลัก</th><th>ผลผลิต</th></tr></thead><tbody><tr><td>Analysis</td><td>ใครเรียน และต้องแก้ปัญหาอะไร?</td><td>ข้อมูลผู้เรียน ความต้องการ ข้อจำกัด</td></tr><tr><td>Design</td><td>จะเรียนและวัดอย่างไร?</td><td>วัตถุประสงค์ ผังบทเรียน สตอรีบอร์ด</td></tr><tr><td>Development</td><td>จะสร้างและตรวจคุณภาพอย่างไร?</td><td>สื่อ บทเรียน แบบทดสอบต้นแบบ</td></tr><tr><td>Implementation</td><td>จะนำไปใช้จริงอย่างไร?</td><td>การจัดการใช้งานและข้อมูลจากการใช้</td></tr><tr><td>Evaluation</td><td>บรรลุเป้าหมายและปรับปรุงอะไร?</td><td>รายงานผล ข้อเสนอแนะ การปรับปรุง</td></tr></tbody></table></div><p class="note">ADDIE ไม่จำเป็นต้องเดินเป็นเส้นตรง สามารถย้อนกลับเพื่อปรับปรุงได้</p><p class="small">อ้างอิง: Branch (2009)</p>`,
`<h2>บทที่ 2 การออกแบบการสอน</h2><p>วัตถุประสงค์ที่วัดได้ระบุพฤติกรรมที่สังเกตได้ เงื่อนไข (ถ้ามี) และเกณฑ์ เช่น “เมื่อมีกรณีศึกษา ผู้เรียนจำแนกปัญหาได้ถูกอย่างน้อย 4 จาก 5 กรณี”</p><h3>Bloom ฉบับปรับปรุง</h3><div class="scroll"><table><tr><th>ระดับ</th><th>ตัวอย่างกริยา</th></tr><tr><td>Remember</td><td>ระบุ บอกชื่อ</td></tr><tr><td>Understand</td><td>สรุป อธิบาย</td></tr><tr><td>Apply</td><td>ใช้ ดำเนินการ</td></tr><tr><td>Analyze</td><td>แยกแยะ เปรียบเทียบ</td></tr><tr><td>Evaluate</td><td>วิจารณ์ ตัดสินตามเกณฑ์</td></tr><tr><td>Create</td><td>ออกแบบ สร้าง</td></tr></table></div><h3>เหตุการณ์การสอน 9 ขั้นของ Gagné</h3><ol>${gagne.map(x=>`<li>${x}</li>`).join('')}</ol><p class="note">การจัดระดับการคิดต้องพิจารณาบริบทของงานและหลักฐาน ไม่ควรตัดสินจากคำกริยาเพียงคำเดียว</p><p class="small">อ้างอิง: Anderson &amp; Krathwohl (2001); Gagné et al. (2005)</p>`,
`<h2>บทที่ 3 การออกแบบสื่อและกิจกรรม</h2><h3>หลักการออกแบบมัลติมีเดียของ Mayer</h3><ul><li><b>Coherence:</b> ตัดสิ่งไม่เกี่ยวข้อง</li><li><b>Signaling:</b> ใช้สัญญาณเน้นสาระสำคัญ</li><li><b>Segmenting:</b> แบ่งบทเรียนเป็นช่วงที่ควบคุมได้</li><li><b>Spatial contiguity:</b> วางข้อความใกล้ภาพที่เกี่ยวข้อง</li><li><b>Redundancy:</b> ระวังข้อความบนจอที่ซ้ำคำบรรยายเสียงแบบคำต่อคำร่วมกับภาพจนเพิ่มภาระ</li></ul><h3>ปฏิสัมพันธ์ 3 ประเภทของ Moore</h3><p>ผู้เรียน–เนื้อหา, ผู้เรียน–ผู้สอน, ผู้เรียน–ผู้เรียน</p><h3>การเข้าถึงตาม WCAG 2.x AA</h3><ul><li>ข้อความปกติควรมีความต่างสีอย่างน้อย 4.5:1 และข้อความใหญ่ 3:1</li><li>ภาพที่ให้สาระควรมี alt text อธิบายความหมาย</li><li>วิดีโอที่บันทึกไว้และมีเสียงพูดควรมีคำบรรยาย (captions) ที่สัมพันธ์กับเวลา</li><li>ใช้งานด้วยแป้นพิมพ์ได้ และไม่ใช้สีอย่างเดียวสื่อสถานะ</li></ul><p class="small">อ้างอิง: Mayer (2009); Moore (1989); W3C (2023)</p>`,
`<h2>บทที่ 4 การวัดผลและข้อมูลการเรียนรู้</h2><p><b>Formative</b> ใช้ข้อมูลระหว่างเรียนเพื่อปรับการสอน; <b>Summative</b> ใช้สรุปผลเมื่อสิ้นสุดช่วงเรียน</p><h3>ก่อนเรียน–หลังเรียนและ normalized gain</h3><p>Individual normalized gain: g = (คะแนนหลัง − คะแนนก่อน) ÷ (คะแนนเต็ม − คะแนนก่อน) หากคะแนนก่อนเต็มแล้วไม่สามารถคำนวณได้ เพราะตัวส่วนเป็นศูนย์ และค่าเป็นลบได้เมื่อคะแนนลดลง เช่น 4/8 ไป 6/8 ได้ g = 0.50</p><p>สำหรับระดับกลุ่ม gain จากคะแนนเฉลี่ยก่อน–หลัง แตกต่างจากค่าเฉลี่ย gain ของแต่ละคน จึงต้องระบุวิธีคำนวณให้ชัดเจน ค่าจากข้อสอบ 8 ข้อไม่ควรใช้ชี้ขาดผลการเรียนรู้</p><h3>Kirkpatrick 4 ระดับ</h3><ol><li><b>Reaction:</b> ความคิดเห็นต่อประสบการณ์</li><li><b>Learning:</b> ความรู้หรือทักษะที่ได้รับ</li><li><b>Behavior:</b> การนำไปใช้จริง</li><li><b>Results:</b> ผลลัพธ์ระดับองค์กรหรือเป้าหมายงาน</li></ol><h3>มาตรฐานข้อมูลการเรียน</h3><p><b>SCORM</b> ใช้จัดแพ็กเกจและติดตามบทเรียนใน LMS ที่รองรับ; <b>xAPI</b> บันทึกกิจกรรมเป็น statement เช่น <i>Actor–Verb–Object</i> (“ผู้เรียน กรอก แบบฝึกหัด”)</p><p class="note">ข้อมูลการเรียนรู้ควรเก็บเท่าที่จำเป็น แจ้งวัตถุประสงค์และการใช้ข้อมูลอย่างโปร่งใส ฐานกฎหมายอาจต่างกันตามบริบท จึงไม่ใช่ทุกกรณีที่ต้องอาศัยความยินยอม หากใช้ความยินยอมเป็นฐานต้องจัดการตามข้อกำหนดที่เกี่ยวข้อง ระบบตัวอย่างนี้บันทึกเฉพาะในเบราว์เซอร์ และล้างได้ด้วยปุ่มเริ่มใหม่</p><p class="small">อ้างอิง: Hake (1998); Kirkpatrick &amp; Kirkpatrick (2006)</p>`
];
function shuffled(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nav(){const max=state.done.length?Math.max(...state.done,state.page):state.page;$('nav').innerHTML=titles.map((t,i)=>`<button type="button" data-page="${i}" ${i>max+1?'disabled':''} ${state.page===i?'aria-current="page"':''}>${state.done.includes(i)?'✓ ':''}${esc(t)}</button>`).join('');$('nav').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page));$('progress').value=state.done.length;$('progress-label').textContent=Math.round(state.done.length/16*100)+'%';$('who').textContent=(state.nick?'ผู้เรียน: '+state.nick+' · ':'')+'ข้อมูลอยู่ในเครื่องนี้เท่านั้น'}
function go(p){if(p<0||p>15)return;state.page=p;save();render();$('side').classList.remove('open');$('menu').setAttribute('aria-expanded','false');window.scrollTo(0,0)}
function finish(){if([3,6,9,12].includes(state.page)&&!state.activity[Math.floor((state.page-3)/3)]?.passed)return;if(!state.done.includes(state.page))state.done.push(state.page);save();go(Math.min(15,state.page+1))}
function action(label='ถัดไป'){return `<div class="actions"><button id="next" type="button">${label}</button></div>`}
function render(){nav();let p=state.page,html='';if(p===0){html=`<h1>ELD-101 การออกแบบและพัฒนา e-Learning</h1><div class="banner">คอร์สสำหรับนักศึกษาครูคอมพิวเตอร์ ชั้นปีที่ 3 · เวลาโดยประมาณ 90 นาที</div><div class="box"><h2>วัตถุประสงค์การเรียนรู้</h2><ol><li>อธิบายขั้นตอน ADDIE และผลงานแต่ละขั้น</li><li>เขียนวัตถุประสงค์ที่วัดได้ และจัดลำดับบทเรียนตาม Gagné</li><li>วินิจฉัยปัญหาสื่อด้วย Mayer และเกณฑ์การเข้าถึง</li><li>เลือกหลักฐานประเมินผลการเรียนรู้ได้เหมาะสม</li></ol><label for="nick">ชื่อเล่นหรือรหัสสมมติ (ไม่กรอกชื่อจริง)</label><br><input id="nick" maxlength="24" autocomplete="off" value="${esc(state.nick)}" placeholder="เช่น Learner07"><p class="small">ใช้ชื่อเล่นเท่านั้น คะแนนและความก้าวหน้าจัดเก็บในเครื่องนี้ ไม่ส่งไปภายนอก</p>${action('เริ่มเรียน')}</div>`}
else if(p===1||p===14){const after=p===14,done=after?state.post:state.pre,orderKey=after?'postChoices':'preChoices';if(!Array.isArray(state[orderKey])||state[orderKey].length!==8||state[orderKey].some(a=>!Array.isArray(a)||a.length!==4||new Set(a).size!==4)){state[orderKey]=test.map(()=>shuffled(4));save()}html=`<h1>${after?'ทดสอบหลังเรียน':'ทดสอบก่อนเรียน'}</h1><p>8 ข้อ · เลือกคำตอบที่ถูกที่สุดเพียงข้อเดียว ${after?'ใช้เปรียบเทียบพัฒนาการ':'ไม่ตัดสินผ่านหรือไม่ผ่าน'}</p><form id="testform">${test.map((q,i)=>`<fieldset class="q"><legend>ข้อ ${i+1}. ${esc(q[0])}</legend>${state[orderKey][i].map(j=>`<label class="option"><input type="radio" name="q${i}" value="opt${i}-${j}" ${done&&done.answers[i]===j?'checked':''} ${done?'disabled':''}>${esc(q[1][j])}</label>`).join('')}${done?`<div class="feedback ${done.answers[i]===q[2]?'correct':'wrong'}">${done.answers[i]===q[2]?'ถูกต้อง':'ยังไม่ถูก'} · ${esc(q[3])}</div>`:''}</fieldset>`).join('')}${done?`<p class="banner">คะแนน ${done.score}/8</p>${action()}`:'<button type="submit">ส่งคำตอบและดูเฉลย</button><p id="testmsg" class="wrong" role="status"></p>'}</form>`}
else if(p===15){const pre=state.pre?.score,post=state.post?.score,g=pre==null||post==null?null:gain(pre,post);html=`<h1>สรุปผลการเรียนรู้</h1>${pre==null||post==null?'<p>กรุณาทำแบบทดสอบก่อนและหลังเรียนให้ครบ</p>':`<div class="box"><p><b>คะแนนก่อนเรียน:</b> ${pre}/8</p><p><b>คะแนนหลังเรียน:</b> ${post}/8</p><p><b>Normalized gain:</b> ${g===null?'ไม่สามารถคำนวณได้ (คะแนนก่อนเรียนเต็ม)':g.toFixed(2)}</p><p>${g===null?'ไม่เหลือช่องว่างสำหรับการเพิ่มคะแนนตามสูตร':g<0?'คะแนนหลังเรียนลดลง':g===0?'คะแนนไม่เปลี่ยนแปลง':'คะแนนหลังเรียนเพิ่มขึ้นเมื่อเทียบกับช่องว่างที่เหลือ'}</p><p><b>บทเรียนที่ครบ:</b> ${[4,7,10,13].filter(i=>state.done.includes(i)).length}/4 บท</p></div><p class="note">แบบทดสอบมีเพียง 8 ข้อ ค่าที่ได้ของรายบุคคลใช้เพื่อสะท้อนและวางแผนทบทวนเท่านั้น ไม่ควรนำไปสรุปประสิทธิผลเชิงสาเหตุ</p><p class="small">แนวคิด normalized gain อ้างอิง Hake (1998) · ค่ารายบุคคลคำนวณจากคะแนนคนหนึ่ง ส่วนค่า gain ระดับกลุ่มอาจคำนวณจากคะแนนเฉลี่ยก่อนและหลังเรียน จึงไม่จำเป็นต้องเท่ากับค่าเฉลี่ยของ gain รายบุคคล</p>`}`}
else {const unit=Math.floor((p-2)/3),phase=(p-2)%3;if(phase===0)html=contents[unit]+action('ไปทำกิจกรรม');if(phase===1)html=activityHTML(unit);if(phase===2)html=checksHTML(unit)}
$('screen').innerHTML=html;
if(p===0){$('next').onclick=()=>{const v=$('nick').value.trim();if(!v){$('nick').focus();return}state.nick=v;finish()}}
else if(p===1||p===14){const done=p===14?state.post:state.pre;if(done)$('next').onclick=finish;else $('testform').onsubmit=e=>{e.preventDefault();const answers=test.map((_,i)=>{const el=document.querySelector(`input[name=q${i}]:checked`);return el?Number(el.value.split('-')[1]):null});if(answers.some(x=>x===null)){$('testmsg').textContent='กรุณาตอบให้ครบทั้ง 8 ข้อ';return}const record={answers,score:answers.reduce((n,a,i)=>n+(a===test[i][2]),0)};if(p===14)state.post=record;else state.pre=record;save();render()}}
else if(p>1&&p<14){const unit=Math.floor((p-2)/3),phase=(p-2)%3;if(phase===0)$('next').onclick=finish;else if(phase===1)bindActivity(unit);else bindChecks(unit)}
}
function activityHTML(u){const a=acts[u],stored=state.activity[u],rows=(u===0?(stored?.selected||[]):a.prompts);return `<h1>บท ${u+1} · กิจกรรมโต้ตอบ</h1><p>${a.intro}</p><div class="box">${u===0?`<p>ขั้นที่ ${rows.length+1} จาก 5</p><div>${rows.map((j,i)=>`<button class="secondary step" type="button" data-remove="${i}">${i+1}. ${a.labels[j]} ×</button>`).join('')}</div><div>${a.labels.map((s,i)=>`<button type="button" class="step secondary" data-choice="${i}" ${rows.includes(i)?'disabled':''}>${s}</button>`).join('')}</div>`:a.prompts.map((s,i)=>`<div class="activity-row"><label for="act${i}">${i+1}. ${s}</label><select id="act${i}"><option value="">เลือกคำตอบ</option>${a.labels.map((v,j)=>`<option value="${j}" ${stored?.selected?.[i]===j?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}<div class="actions"><button id="verify" type="button">ตรวจคำตอบ</button><button id="clear-act" type="button" class="secondary">ล้างคำตอบ</button></div><div id="activity-msg" role="status" aria-live="polite"></div>${stored?.passed?action('ไปตรวจความเข้าใจ'):''}</div>`}
function bindActivity(u){const a=acts[u];let selected=Array.isArray(state.activity[u]?.selected)?[...state.activity[u].selected]:[];const update=()=>{state.activity[u]={selected,passed:false};save();render()};if(u===0){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(selected.length<5)selected.push(+b.dataset.choice);update()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.splice(+b.dataset.remove,1);update()})}else a.prompts.forEach((_,i)=>{$('act'+i).onchange=e=>{selected[i]=e.target.value===''?null:+e.target.value;state.activity[u]={selected,passed:false};save()}});$('clear-act').onclick=()=>{selected=[];update()};$('verify').onclick=()=>{if(selected.length!==a.correct.length||selected.some(x=>x==null)){$('activity-msg').textContent='กรุณาตอบให้ครบทุกข้อ';return}const count=a.correct.filter((v,i)=>selected[i]===v).length;state.activity[u]={selected,passed:count===a.correct.length};save();$('activity-msg').innerHTML=`<p class="${count===a.correct.length?'correct':'wrong'}">ถูก ${count}/${a.correct.length} ข้อ ${count===a.correct.length?'ครบแล้ว ไปต่อได้':'พิจารณาเหตุผลแล้วลองแก้ไขอีกครั้ง'}</p>`+(u===0?'':a.prompts.map((_,i)=>`<p>${i+1}. ${selected[i]===a.correct[i]?'ถูกต้อง':'ควรเลือก '+a.labels[a.correct[i]]} — ${esc((u===2?['ตัดเสียงที่ไม่เกี่ยวกับเนื้อหา','ใช้สัญญาณชี้จุดสำคัญในแผนผัง','แบ่งสื่อเป็นช่วงที่ผู้เรียนควบคุมได้','วางป้ายอธิบายชิดกับภาพที่เกี่ยวข้อง']:u===1?['ดึงความสนใจ','แจ้งผลที่คาดหวัง','ทบทวนความรู้เดิม','นำเสนอสาระใหม่','ชี้แนะแนวทาง','ให้ลงมือฝึก','ให้ข้อเสนอแนะ','ประเมินผลงาน','ส่งเสริมการประยุกต์']:['วัดปฏิกิริยา','วัดความรู้หรือทักษะ','ดูการนำไปใช้จริง','ดูผลลัพธ์ขององค์กร'])[i])}</p>`).join(''));if(count===a.correct.length)render()};if($('next'))$('next').onclick=finish}
function checksHTML(u){let done=state.checks[u];return `<h1>บท ${u+1} · ตรวจความเข้าใจ</h1><form id="checkform">${checks[u].map((q,i)=>`<fieldset class="q"><legend>${i+1}. ${q[0]}</legend>${q[1].map((s,j)=>`<label class="option"><input type="radio" name="c${i}" value="${j}" ${done?.answers?.[i]===j?'checked':''} ${done?'disabled':''}>${s}</label>`).join('')}${done?`<p class="${done.answers[i]===q[2]?'correct':'wrong'}">${done.answers[i]===q[2]?'ถูกต้อง':'ยังไม่ถูก'} · ${q[3]}</p>`:''}</fieldset>`).join('')}${done?action('เรียนหัวข้อถัดไป'):'<button type="submit">ตรวจคำตอบ</button><p id="checkmsg" role="status"></p>'}</form>`}
function bindChecks(u){if(state.checks[u]){$('next').onclick=finish;return}$('checkform').onsubmit=e=>{e.preventDefault();let answers=checks[u].map((_,i)=>{let el=document.querySelector(`input[name=c${i}]:checked`);return el?+el.value:null});if(answers.includes(null)){$('checkmsg').textContent='กรุณาตอบทั้ง 2 ข้อ';return}state.checks[u]={answers};save();render()}}
$('menu').onclick=()=>{const open=$('side').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open));$('menu').textContent=open?'ปิดสารบัญ':'เปิดสารบัญ'};
const cancelRestart=()=>{restartArmed=false;$('restart').textContent='เริ่มใหม่ (กด 2 ครั้ง)';$('restart-msg').textContent='';$('cancel-restart').hidden=true};$('restart').onclick=()=>{if(!restartArmed){restartArmed=true;$('restart-msg').textContent='หากยืนยันจะลบชื่อเล่น คะแนน และความก้าวหน้าของคอร์สนี้เท่านั้น';$('restart').textContent='ยืนยันเริ่มใหม่';$('cancel-restart').hidden=false;return}cancelRestart();safeRemove();state=blank();go(0)};$('cancel-restart').onclick=cancelRestart;
$('theme').onclick=()=>{const cur=document.documentElement.dataset.theme|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=cur==='dark'?'light':'dark'};
render();
</script></body></html>
